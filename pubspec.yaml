name: caption_ai
description: Pro-level AI Caption Generator & Kinetic Typography app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # State Management
  provider: ^6.1.2

  # File & Media
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  permission_handler: ^11.3.1

  # Video
  video_player: ^2.9.1
  chewie: ^1.8.5

  # FFmpeg (video processing)
  ffmpeg_kit_flutter_new: ^1.5.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/styles/
